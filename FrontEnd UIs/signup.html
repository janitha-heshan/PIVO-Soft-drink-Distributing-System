<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PIVO — Sign Up</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <img src="images/logo-placeholder.png" alt="PIVO" class="logo" />
      <span class="brand-name">PIVO Holdings</span>
    </div>

  </header>

  <main class="container">
    <section class="form-card">
      <h1>Create Account</h1>
      
      <form class="form" id="signupForm">
        <label>
          Username
          <input type="text" id="username" name="username" placeholder="Choose a username" required />
        </label>

        <label>
          Email Address
          <input type="email" id="email" name="email" placeholder="Enter your email" required />
        </label>
        
        <label>
          Password
          <input type="password" id="password" name="password" placeholder="Create a password" required />
        </label>

        <label>
          Confirm Password
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required />
        </label>

        <button type="submit" class="primary full">Sign Up</button>
      </form>

      <p class="muted">
        Already have an account? <a href="login.html" class="accent-link">Log In</a>
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <small>© <span id="year"></span> PIVO Holdings</small>
  </footer>

  <script src="signup.js"></script>
</body>
</html>
